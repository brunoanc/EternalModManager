[package]
name = "eternal_mod_manager"
description = "Cross platform mod manager for DOOM Eternal."
version = "4.2.1"
authors = ["Bruno Ancona <brunoanconasala@gmail.com>"]
license = "MIT"
repository = "https://github.com/brunoanc/EternalModManager"
homepage = "https://flathub.org/apps/io.github.brunoanc.eternalmodmanager"
edition = "2024"

[dependencies]
adw = { version = "0.8.0", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.10.1", package = "gtk4", features = ["gnome_48"] }
reqwest = { version = "0.12.23", features = ["blocking"] }
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }
notify-debouncer-mini = { version =  "0.7.0", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
serde_json = "1.0.145"
im = "15.1.0"
open = "5.3.2"
walkdir = "2.5.0"
once_cell = "1.21.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["UI_ViewManagement"] }

[build-dependencies]
winresource = "0.1.23"

[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = true
