[package]
name = "eternal_mod_manager"
description = "Cross platform mod manager for DOOM Eternal."
version = "4.2.4"
authors = ["Bruno Ancona <brunoanconasala@gmail.com>"]
license = "MIT"
repository = "https://github.com/brunoanc/EternalModManager"
homepage = "https://flathub.org/apps/io.github.brunoanc.eternalmodmanager"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
notify-debouncer-mini = { version =  "0.7.0", default-features = false }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
serde_json = "1.0.154"
imbl = "7.0.2"
open = "5.4.4"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["UI_ViewManagement"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = true
